daemon:
  listen: "http://127.0.0.1:8765"
  dataPath: ""
  apiTokenRef: "env://PSI_EVENTD_TOKEN"

connections:
  - id: "finance-feishu"
    provider: "feishu"
    transport: "websocket"
    tenantId: "tenant_x"
    appId: "cli_x"
    appSecretRef: "env://PSI_FEISHU_APP_SECRET"
    approvalCodes:
      - "EXPENSE_001"
    reconciliation:
      enabled: true
      intervalSeconds: 900
      overlapSeconds: 3600

subscriptions:
  - id: "haitun-finance-agent"
    filter:
      sourcePrefix: "feishu://tenant_x/cli_x/approval"
      types:
        - "approval.status.changed"
      data:
        approvalCodes:
          - "EXPENSE_001"
    leaseSeconds: 60
    maxAttempts: 10
    deadLetterAfterSeconds: 604800

consumer:
  daemonEndpoint: "http://127.0.0.1:8765"
  subscriptionId: "haitun-finance-agent"
  sessionSocket: "http://127.0.0.1:8766"
  renewEverySeconds: 20
  leaseSeconds: 60
  waitSeconds: 20
  apiTokenRef: "env://PSI_EVENTD_TOKEN"
  routing:
    session_id: "finance-agent"
