daemon:
  listen: "http://127.0.0.1:8765"
  dataPath: ""
  apiTokenRef: "env://PSI_EVENTD_TOKEN"

hooks:
  - id: "orders"
    tokenRef: "env://ORDERS_HOOK_TOKEN"
    source: "webhook://orders"
    type: "order.received"
    idFrom:
      header: "X-Event-Id"

subscriptions:
  - id: "order-agent"
    filter:
      sourcePrefix: ""
      types:
        - "order.received"
        - "order.paid"
    leaseSeconds: 60
    maxAttempts: 10

consumer:
  daemonEndpoint: "http://127.0.0.1:8765"
  subscriptionId: "order-agent"
  sessionSocket: "http://127.0.0.1:8766"
  renewEverySeconds: 20
  leaseSeconds: 0
  waitSeconds: 20
  apiTokenRef: "env://PSI_EVENTD_TOKEN"
  routing:
    session_id: "order-agent"
