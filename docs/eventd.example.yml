daemon:
  listen: "http://127.0.0.1:8765"
  dataPath: ""
  apiTokenRef: "env://PSI_EVENTD_TOKEN"

webhookListeners:
  - id: "order_hook"
    tokenRef: "env://ORDERS_HOOK_TOKEN"
    idFrom:
      header: "X-Event-Id"
    leaseSeconds: 60
    maxAttempts: 10

consumer:
  daemonEndpoint: "http://127.0.0.1:8765"
  subscriptionId: "order_hook"
  sessionSocket: "http://127.0.0.1:8766"
  renewEverySeconds: 20
  leaseSeconds: 0
  waitSeconds: 20
  apiTokenRef: "env://PSI_EVENTD_TOKEN"
  routing:
    session_id: "order-agent"
