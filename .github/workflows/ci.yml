name: CI

on:
  push:
  pull_request:

jobs:
  generated-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
      - name: Download ANTLR 4.13.2
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/antlr-4.13.2-complete.jar" \
            https://www.antlr.org/download/antlr-4.13.2-complete.jar
          echo "eae2dfa119a64327444672aff63e9ec35a20180dc5b8090b7a6ab85125df4d76  $RUNNER_TEMP/antlr-4.13.2-complete.jar" \
            | sha256sum --check
      - name: Verify FusionMethod generated sources
        working-directory: examples/haitun-workspace/skills/fusion-method
        run: |
          output="$RUNNER_TEMP/fusion-method-generated"
          mkdir "$output"
          java -jar "$RUNNER_TEMP/antlr-4.13.2-complete.jar" \
            -Dlanguage=Python3 -no-listener -Xexact-output-dir \
            -o "$output" grammar/FusionMethod.g4
          diff -u fusion_method/generated/FusionMethodLexer.py "$output/FusionMethodLexer.py"
          diff -u fusion_method/generated/FusionMethodParser.py "$output/FusionMethodParser.py"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check .

  fusion-method-test:
    needs: [generated-sources, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync
      - name: Test FusionMethod
        working-directory: examples/haitun-workspace/skills/fusion-method
        run: uv run python -m pytest -q --rootdir=. test

  coscientist-ows-bundle:
    needs: fusion-method-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build workspace overlay
        run: |
          mkdir -p dist
          archive_name="coscientist-ows-${GITHUB_SHA}.tar.gz"
          archive="dist/${archive_name}"
          tar -C examples/haitun-workspace -czf "$archive" \
            mtds/methods/coscientist-ows \
            skills/coscientist-ows-entry \
            skills/mattergen-structure-sampler \
            skills/mattersim-structure-evaluator \
            skills/ows-catalyst-recommender \
            skills/round-parallel-synthesis-advisor \
            skills/source-liquid-sop-designer \
            skills/stage08-catalytic-performance-prover \
            skills/stage08-synthesis-safety-feasibility-judge
          (
            cd dist
            sha256sum "$archive_name" > "$archive_name.sha256"
          )
      - uses: actions/upload-artifact@v7
        with:
          name: coscientist-ows-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  test:
    if: false # Temporarily pause the repository-wide suite; scoped suites run separately.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run pytest -v

  publish:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci
        working-directory: src/psi_agent/gateway/spa
      - run: npm run build
        working-directory: src/psi_agent/gateway/spa
      - run: npm ci
        working-directory: src/psi_agent/gateway/spa-v2
      - run: npm run build
        working-directory: src/psi_agent/gateway/spa-v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
